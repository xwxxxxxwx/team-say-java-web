<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TeacherDashboard - S.A.Y.</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <link href="https://cdn.quilljs.com/1.3.6/quill.snow.css" rel="stylesheet">
    <script src="https://cdn.quilljs.com/1.3.6/quill.min.js"></script>
    <style>
        :root {
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent: #3498db;
            --accent-light: #e1f0fa;
            --shadow: rgba(0, 0, 0, 0.1);
            --background-color: #ffffff;
            --card-background: #ffffff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                    linear-gradient(45deg, var(--accent-light) 25%, transparent 25%),
                    linear-gradient(-45deg, var(--accent-light) 25%, transparent 25%),
                    linear-gradient(45deg, transparent 75%, var(--accent-light) 75%),
                    linear-gradient(-45deg, transparent 75%, var(--accent-light) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            opacity: 0.2;
            z-index: -1;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 1rem 0;
            box-shadow: 0 2px 10px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 2em;
            font-weight: bold;
            color: var(--text-primary);
        }
        .user-info {
            display: flex;
            align-items: center;
            position: relative;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent);
            color: var(--background-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }
        .user-details {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: var(--card-background);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--shadow);
            z-index: 100;
            min-width: 250px;
            font-size: 14px;
        }

        .user-details p {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }

        .user-details i {
            width: 20px;
            margin-right: 10px;
            color: var(--accent);
        }

        .user-details .button {
            margin-top: 15px;
            width: 100%;
            text-align: center;
        }

        .user-details .button i {
            margin-right: 5px;
        }
        .user-details p span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 200px;
            display: inline-block;
        }
        .user-details .button {
            margin-top: 15px;
            width: 100%;
            text-align: center;
            background-color: var(--accent);
            color: white;
            padding: 10px;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .user-details .button:hover {
            background-color: var(--accent-light);
            color: var(--accent);
        }
        .user-info:hover .user-details {
            display: block;
        }
        .main-content {
            padding: 2rem 0;
        }
        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        #courseList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .course-card {
            background: var(--card-background);
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--shadow);
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px var(--shadow);
        }
        .course-card.science { border-top: 4px solid #3498db; }
        .course-card.art { border-top: 4px solid #e91e63; }
        .course-card.engine { border-top: 4px solid #e67e22; }
        .course-card.math { border-top: 4px solid #2ecc71; }
        .incomplete-tag {
            background-color: var(--accent);
            color: var(--background-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            display: inline-block;
            margin-bottom: 10px;
        }
        .config-button {
            position: absolute;
            top: 10px;
            right: 10px;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            font-size: 1.2em;
            transition: color 0.3s ease;
        }
        .config-button:hover {
            color: var(--accent);
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background: var(--accent);
            color: var(--background-color);
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .button:hover {
            background: var(--accent-light);
            color: var(--accent);
            transform: translateY(-2px);
        }
        .button i {
            margin-right: 5px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: var(--card-background);
            margin: 10% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--shadow);
        }
        .close {
            color: var(--text-secondary);
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .close:hover,
        .close:focus {
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
        }
        #feedbackList {
            max-height: 400px;
            overflow-y: auto;
        }
        #courseSelect {
            width: 100%;
            padding: 10px;
            margin-bottom: 20px;
            border-radius: 4px;
            border: 1px solid var(--accent-light);
            background-color: var(--background-color);
            color: var(--text-primary);
        }
        .unread-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background-color: red;
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .delete-button {
            background-color: transparent;
            color: var(--text-secondary);
            border: none;
            padding: 5px;
            cursor: pointer;
            float: right;
            font-size: 1.2em;
            transition: color 0.3s ease;
        }
        .delete-button:hover {
            color: #e74c3c;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-primary);
        }
        .form-group input,
        .form-group .ql-container {
            width: 100%;
            padding: 8px;
            border: 1px solid var(--accent-light);
            border-radius: 4px;
            background-color: var(--background-color);
            color: var(--text-primary);
        }
        .form-group input:focus,
        .form-group .ql-container:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }

        .right-section {
            display: flex;
            align-items: center;
        }
        .feedback-button {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: var(--accent);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0 2px 10px var(--shadow);
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .feedback-button:hover {
            background-color: var(--accent-light);
            color: var(--accent);
        }

        .feedback-button i {
            font-size: 24px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }
            .course-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .course-header .button {
                margin-top: 10px;
            }
        }
        .modal-content {
            background-color: var(--card-background);
            margin: 5% auto;
            padding: 30px;
            border: 1px solid #888;
            width: 90%;
            max-width: 600px;
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--shadow);
        }
        .modal-content h2 {
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
        }

        .modal-content h2 i {
            margin-right: 10px;
            color: var(--accent);
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: flex;
            align-items: center;
            margin-bottom: 5px;
            color: var(--text-secondary);
            font-weight: bold;
        }

        .form-group label i {
            margin-right: 10px;
            color: var(--accent);
            width: 20px;
            text-align: center;
        }

        .form-group input,
        .form-group .ql-container {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--accent-light);
            border-radius: 4px;
            font-size: 1rem;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        .form-group input:focus,
        .form-group .ql-container:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.25);
        }

        .ql-container {
            height: 150px;
            margin-bottom: 20px;
        }

        #feedbackModal .modal-content {
            max-width: 800px;
            padding: 30px;
        }

        #feedbackModal h2 {
            color: var(--text-primary);
            margin-bottom: 20px;
            font-size: 1.8em;
            display: flex;
            align-items: center;
        }

        #feedbackModal h2 i {
            margin-right: 10px;
            color: var(--accent);
        }

        #courseSelect {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid var(--accent-light);
            border-radius: 4px;
            font-size: 1rem;
        }

        .feedback-item {
            background-color: var(--card-background);
            border: 1px solid var(--accent-light);
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--shadow);
            cursor: pointer;
        }

        .feedback-item:hover {
            box-shadow: 0 4px 15px var(--shadow);
        }

        .feedback-item.unread {
            border-left: 5px solid var(--accent);
            background-color: var(--accent-light);
        }

        .feedback-item.read {
            border-left: 5px solid var(--shadow);
            background-color: #f4f4f4;
        }

        .feedback-item p {
            margin-bottom: 5px;
        }

        .feedback-item strong {
            color: var(--text-secondary);
        }

        .delete-button {
            float: right;
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .delete-button:hover {
            color: #e74c3c;
        }

    </style>
</head>
<body>
<header class="header">
    <div class="container">
        <div class="header-content">
            <h1 class="logo">S.A.Y.--Teacher Dashboard</h1>
            <div class="right-section">

                <div class="user-info" th:if="${user != null}">
                    <div class="user-avatar" th:text="${#strings.toUpperCase(#strings.substring(user.username, 0, 1))}"></div>
                    <div class="user-details">
                        <p><i class="fas fa-user"></i> <span th:text="${user.username}"></span></p>
                        <p><i class="fas fa-id-card"></i> <span th:text="${user.userId}"></span></p>
                        <p><i class="fas fa-graduation-cap"></i> <span th:text="${user.major}"></span></p>
                        <p><i class="fas fa-envelope"></i> <span th:text="${user.email}"></span></p>
                        <p><i class="fas fa-user-tag"></i> <span th:text="${user.userType}"></span></p>
                        <a href="/" class="button"><i class="fas fa-sign-out-alt"></i> Log out</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<a href="#" id="feedbackLink" class="feedback-button">
    <i class="fas fa-comment"></i>
    <span id="unreadCount" class="unread-count" style="display: none;"></span>
</a>

<main class="main-content">
    <div class="container">
        <div class="course-header">
            <h2>My Courses</h2>
            <a href="/course/createModel" class="button" id="createCourseBtn">Create Course</a>
        </div>
        <div id="courseList">
            <div th:each="course : ${courses}"
                 th:class="'course-card ' + ${course.courseCategory.toLowerCase()}"
                 th:data-course-id="${course.courseId}"
                 th:data-is-real="${course.isReal}"
                 th:data-course-name="${course.courseName}">
                <div th:if="${!course.isReal}" class="incomplete-tag">Unfinished</div>
                <div th:text="${course.courseId}"></div>
                <div th:text="${course.courseName}"></div>
                <button class="config-button" th:data-course-id="${course.courseId}">
                    <i class="fas fa-cog"></i>
                </button>
            </div>
        </div>
    </div>
</main>

<!-- 反馈模态框 -->
<div id="feedbackModal" class="modal">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2><i class="fas fa-comments"></i> Course Feedback</h2>
        <select id="courseSelect">
            <option value="all">All courses</option>
        </select>
        <div id="feedbackList"></div>
    </div>
</div>

<script>
    document.getElementById('courseList').addEventListener('click', function(e) {
        const courseCard = e.target.closest('.course-card');
        if (courseCard) {
            const courseId = courseCard.getAttribute('data-course-id');
            const courseName = courseCard.getAttribute('data-course-name')
            const isReal = courseCard.getAttribute('data-is-real');  // 获取 is_real 属性

            // 根据 is_real 属性决定重定向路径
            if (isReal === "true") {
                window.location.href = `/course-detailT?id=` + courseId;
            } else {
                window.location.href = `/menu/view?courseId=` + courseId;
            }
        }
    });
    // 新增反馈相关脚本
    const feedbackLink = document.getElementById('feedbackLink');
    const feedbackModal = document.getElementById('feedbackModal');
    const closeBtn = document.getElementsByClassName('close')[0];
    const courseSelect = document.getElementById('courseSelect');
    const feedbackList = document.getElementById('feedbackList');

    feedbackLink.onclick = function(e) {
        e.preventDefault(); // 阻止链接的默认行为
        feedbackModal.style.display = "block";
        loadCourses();
        loadFeedback('all');
    }

    closeBtn.onclick = function() {
        feedbackModal.style.display = "none";
    }

    window.onclick = function(event) {
        if (event.target == feedbackModal) {
            feedbackModal.style.display = "none";
        }
    }

    courseSelect.onchange = function() {
        loadFeedback(this.value);
    }


    // 修改 loadCourses 函数来更新未读消息计数
    function loadCourses() {
        fetch('/api/report/feedback')
            .then(response => response.json())
            .then(data => {
                const courses = [...new Set(data.map(item => item.courseId))];
                courseSelect.innerHTML = '<option value="all">All Courses</option>';
                courses.forEach(course => {
                    const option = document.createElement('option');
                    option.value = course;
                    option.textContent = course;
                    courseSelect.appendChild(option);
                });

                // 更新未读消息计数
                const unreadCount = data.filter(feedback => !feedback.isRead).length;
                updateUnreadCount(unreadCount);
            });
    }
    // Helper function to ensure consistent boolean interpretation
    function convertToBoolean(value) {
        return value === true || value === "true" || value === 1 || value === "1";
    }

    // **加载反馈数据，并根据 isRead 状态显示已读和未读样式**
    function loadFeedback(courseId) {
        const url = courseId === 'all' ? '/api/report/feedback' : `/api/report/feedback/${courseId}`;

        // 从 API 中获取反馈数据
        fetch(url)
            .then(response => response.json())
            .then(data => {
                console.log("Received feedback data:", data);
                let unreadCount = 0;
                // **1. 使用 convertToBoolean 函数确保 isRead 属性为标准布尔类型**
                data.forEach(feedback => {
                    feedback.isRead = convertToBoolean(feedback.isRead);
                    console.log(`Feedback ID: ${feedback.id}, isRead (after conversion):`, feedback.isRead);  // 打印每条反馈的 isRead 状态
                    if (!feedback.isRead) {
                        unreadCount++;  // Track the unread count
                    }
                });

                // **2. 根据 isRead 属性进行排序：未读消息排在前面**
                data.sort((a, b) => {
                    if (a.isRead === b.isRead) return new Date(b.createdAt) - new Date(a.createdAt);
                    return a.isRead ? 1 : -1;  // isRead 为 false 的排在前面
                });

                // **3. 清空 feedbackList，并重新渲染**
                feedbackList.innerHTML = '';
                data.forEach(feedback => {
                    const feedbackItem = document.createElement('div');
                    // **4. 根据修正后的 isRead 值设置样式**
                    feedbackItem.className = `feedback-item ${feedback.isRead ? 'read' : 'unread'}`;
                    feedbackItem.innerHTML = `
                    <button class="delete-button" data-id="${feedback.id}"><i class="fas fa-trash-alt"></i></button>
                    <p><strong>Course ID:</strong> ${feedback.courseId}</p>
                    <p><strong>Grade:</strong> ${feedback.rating}</p>
                    <p><strong>Comment:</strong> ${feedback.comment}</p>
                    <p><strong>Time:</strong> ${new Date(feedback.createdAt).toLocaleString()}</p>
                `;

                    // **5. 绑定删除按钮事件**
                    feedbackItem.querySelector('.delete-button').onclick = function(e) {
                        e.stopPropagation();
                        deleteFeedback(feedback.id);
                    };

                    // **6. 绑定点击事件来标记为已读**
                    feedbackItem.onclick = function() {
                        if (!feedback.isRead) {  // 如果是未读状态，点击后标记为已读
                            markAsRead(feedback.id, feedbackItem);
                        }
                    };

                    // 将 feedbackItem 添加到 feedbackList 中
                    feedbackList.appendChild(feedbackItem);
                });
                // Update the unread count display initially
                updateUnreadCount(unreadCount);
            });
    }

    // **更新未读消息状态**，并同步计数
    function markAsRead(feedbackId, feedbackElement) {
        fetch(`/api/report/feedback/${feedbackId}/read`, {
            method: 'PUT'
        }).then(() => {
            // **1. 将样式从 "unread" 替换为 "read"**
            feedbackElement.classList.remove('unread');
            feedbackElement.classList.add('read');

            // **2. 更新未读计数**
            const unreadCount = document.querySelectorAll('.feedback-item.unread').length;
            updateUnreadCount(unreadCount);
        });
    }


    // **更新未读消息数量**
    function updateUnreadCount(count) {
        const unreadCountElement = document.getElementById('unreadCount');

        // **1. 如果有未读消息，显示计数**
        if (count > 0) {
            unreadCountElement.textContent = count;
            unreadCountElement.style.display = 'inline';
        } else {
            // **2. 如果没有未读消息，隐藏未读消息提醒**
            unreadCountElement.style.display = 'none';
        }
    }

    // 页面加载时初始化未读消息计数
    document.addEventListener('DOMContentLoaded', function() {
        loadCourses();
    });


    // 处理反馈模态框的显示
    feedbackLink.onclick = function(e) {
        e.preventDefault(); // 阻止链接的默认行为
        feedbackModal.style.display = "block";
        refreshFeedback();
    }

    // 关闭模态框
    closeBtn.onclick = function() {
        feedbackModal.style.display = "none";
    }

    // 模态框外点击关闭
    window.onclick = function(event) {
        if (event.target == feedbackModal) {
            feedbackModal.style.display = "none";
        }
    }

    // 删除反馈
    function deleteFeedback(id) {
        if (confirm('Are you sure you want to delete this feedback?')) {
            fetch(`/api/report/feedback/${id}`, {
                method: 'DELETE'
            }).then(response => {
                if (response.ok) {
                    loadFeedback(courseSelect.value);
                    loadCourses();
                } else {
                    alert('Failed to delete feedback');
                }
            });
        }
    }

    // 新增 refreshFeedback 函数
    function refreshFeedback() {
        const selectedCourse = courseSelect.value;
        loadFeedback(selectedCourse || 'all');
    }


    //配置按钮的部分
    // 创建模态框
    function createModal() {
        const modal = document.createElement('div');
        modal.id = 'courseConfigModal';
        modal.className = 'modal';

        const modalContent = `
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2><i class="fas fa-cog"></i> Course Configuration</h2>
        <form id="courseConfigForm">
            <input type="hidden" id="courseId" name="courseId">
            <div class="form-group">
                <label for="courseName"><i class="fas fa-book"></i> Course Name:</label>
                <input type="text" id="courseName" name="courseName" required>
            </div>
            <div class="form-group">
                <label for="courseDescription"><i class="fas fa-align-left"></i> Course Description:</label>
                <div id="courseDescriptionEditor"></div>
            </div>
            <div class="form-group">
                <label for="courseCategory"><i class="fas fa-tags"></i> Course Category:</label>
                <input type="text" id="courseCategory" name="courseCategory" readonly>
            </div>
            <div class="form-group">
                <label for="coursePin"><i class="fas fa-key"></i> Course PIN:</label>
                <input type="text" id="coursePin" name="coursePin" readonly>
            </div>
            <div class="form-group">
                <label for="aiApi"><i class="fas fa-robot"></i> OpenAI API:</label>
                <input type="text" id="aiApi" name="aiApi">
            </div>
            <div class="form-group">
                <label for="knowledgeBaseLink"><i class="fas fa-link"></i> Knowledge Base Link (Optional):</label>
                <input type="url" id="knowledgeBaseLink" name="knowledgeBaseLink">
            </div>
            <div class="form-group">
                <label for="digitalHumanApi"><i class="fas fa-user-circle"></i> Digital Human API:</label>
                <input type="text" id="digitalHumanApi" name="digitalHumanApi">
            </div>
            <button type="submit" class="button"><i class="fas fa-save"></i> Save Changes</button>
        </form>
    </div>
    `;

        modal.innerHTML = modalContent;
        document.body.appendChild(modal);

        // 初始化Quill编辑器
        var quill = new Quill('#courseDescriptionEditor', {
            theme: 'snow',
            modules: {
                toolbar: [
                    [{ 'font': [] }, { 'size': [] }],
                    ['bold', 'italic', 'underline'],
                    [{ 'list': 'ordered'}, { 'list': 'bullet' }],
                    ['link', 'image']
                ]
            },
            placeholder: 'Enter course description...'
        });

        return modal;
    }

    // 加载课程配置信息
    function loadCourseConfig(courseId) {
        const modal = document.getElementById('courseConfigModal');
        fetch(`/api/course/${courseId}`)
            .then(response => response.json())
            .then(data => {
                document.getElementById('courseId').value = data.courseId;
                document.getElementById('courseName').value = data.courseName;
                const quill = Quill.find(document.getElementById('courseDescriptionEditor'));
                quill.root.innerHTML = data.courseDescription;
                document.getElementById('coursePin').value = data.coursePin;
                document.getElementById('knowledgeBaseLink').value = data.knowledgeBaseLink;
                document.getElementById('aiApi').value = data.aiApi;
                // document.getElementById('digitalHumanApi').value = data.digitalHumanApi;
                document.getElementById('courseCategory').value = data.courseCategory;

                modal.style.display = "block";
            });
    }

    // 当文档加载完成时执行
    document.addEventListener('DOMContentLoaded', function() {
        const modal = createModal();
        const span = modal.querySelector('.close');

        // 当用户点击 (x), 关闭模态框
        span.onclick = function() {
            modal.style.display = "none";
        }

        // 当用户点击模态框外部，关闭它
        window.onclick = function(event) {
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // 为所有配置按钮添加点击事件
        document.querySelectorAll('.config-button').forEach(button => {
            button.addEventListener('click', function(e) {
                e.stopPropagation(); // 阻止事件冒泡到课程卡片
                const courseId = this.getAttribute('data-course-id');
                loadCourseConfig(courseId);
            });
        });

        // 处理表单提交
        document.getElementById('courseConfigForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const courseId = document.getElementById('courseId').value;
            const quill = Quill.find(document.getElementById('courseDescriptionEditor'));

            // 创建一个对象来存储表单数据
            const formData = {
                courseId: courseId,
                courseName: document.getElementById('courseName').value,
                courseDescription: quill.root.innerHTML,
                knowledgeBaseLink: document.getElementById('knowledgeBaseLink').value,
                aiApi: document.getElementById('aiApi').value,
                digitalHumanApi: document.getElementById('digitalHumanApi').value
            };

            fetch(`/api/course/${courseId}`, {
                method: 'PUT',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(formData)
            }).then(response => {
                if (response.ok) {
                    return response.text();
                } else {
                    throw new Error('Failed to update course');
                }
            }).then(data => {
                alert(data);
                modal.style.display = "none";
                // 刷新课程列表
                location.reload();
            }).catch(error => {
                alert(error.message);
            });
        });

        // 初始化其他功能（如果有的话）
        loadCourses();
    });
</script>
