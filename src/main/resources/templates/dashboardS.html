<!DOCTYPE html>
<html lang="zh" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentDashboard - S.A.Y.</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css">
    <style>
        :root {
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent: #3498db;
            --accent-light: #e1f0fa;
            --shadow: rgba(0, 0, 0, 0.1);
            --background-color: #ffffff;
            --card-background: #ffffff;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Arial', sans-serif;
            background-color: var(--background-color);
            color: var(--text-primary);
            line-height: 1.6;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-image:
                    linear-gradient(45deg, var(--accent-light) 25%, transparent 25%),
                    linear-gradient(-45deg, var(--accent-light) 25%, transparent 25%),
                    linear-gradient(45deg, transparent 75%, var(--accent-light) 75%),
                    linear-gradient(-45deg, transparent 75%, var(--accent-light) 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
            opacity: 0.2;
            z-index: -1;
        }
        .container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }
        .header {
            background-color: rgba(255, 255, 255, 0.9);
            padding: 1rem 0;
            box-shadow: 0 2px 10px var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }
        .header-content {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo {
            font-size: 2em;
            font-weight: bold;
            color: var(--text-primary);
        }
        .right-section {
            display: flex;
            align-items: center;
        }
        .nav-link {
            text-decoration: none;
            color: var(--text-primary);
            margin-right: 20px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
        }
        .nav-link:hover {
            color: var(--accent);
        }
        .nav-link i {
            margin-right: 5px;
        }
        .user-info {
            display: flex;
            align-items: center;
            position: relative;
        }
        .user-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent);
            color: var(--background-color);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            cursor: pointer;
        }
        .user-details {
            display: none;
            position: absolute;
            right: 0;
            top: 100%;
            background: var(--card-background);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--shadow);
            z-index: 100;
            min-width: 250px;
            font-size: 14px;
        }
        .user-details p {
            margin-bottom: 10px;
            display: flex;
            align-items: center;
        }
        .user-details i {
            width: 20px;
            margin-right: 10px;
            color: var(--accent);
        }
        .user-details .button {
            margin-top: 15px;
            width: 100%;
            text-align: center;
        }
        .user-info:hover .user-details {
            display: block;
        }
        .main-content {
            padding: 2rem 0;
        }
        .course-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }
        #courseList {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }
        .course-card {
            background: var(--card-background);
            border-radius: 8px;
            box-shadow: 0 4px 15px var(--shadow);
            padding: 1.5rem;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .course-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 6px 20px var(--shadow);
        }
        .course-card.science { border-top: 4px solid #3498db; }
        .course-card.art { border-top: 4px solid #e91e63; }
        .course-card.engine { border-top: 4px solid #e67e22; }
        .course-card.math { border-top: 4px solid #2ecc71; }
        .incomplete-tag {
            background-color: var(--accent);
            color: var(--background-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 0.8em;
            display: inline-block;
            margin-bottom: 10px;
        }
        .button {
            display: inline-block;
            padding: 10px 20px;
            background: var(--accent);
            color: var(--background-color);
            text-decoration: none;
            border-radius: 4px;
            transition: all 0.3s ease;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        .button:hover {
            background: var(--accent-light);
            color: var(--accent);
            transform: translateY(-2px);
        }
        .button i {
            margin-right: 5px;
        }
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: var(--card-background);
            margin: 15% auto;
            padding: 0;
            width: 90%;
            max-width: 400px;
            border-radius: 8px;
            box-shadow: 0 4px 20px var(--shadow);
            overflow: hidden;
        }
        .modal-header {
            background-color: var(--accent);
            color: white;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-header h2 {
            margin: 0;
            font-size: 1.5em;
        }

        .modal-header .close {
            color: white;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
        }

        .modal-header .close:hover {
            color: var(--accent-light);
        }

        .close {
            color: var(--text-secondary);
            float: right;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }
        .close:hover,
        .close:focus {
            color: var(--text-primary);
            text-decoration: none;
            cursor: pointer;
        }
        #addCourseForm {
            padding: 20px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: var(--text-primary);
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--accent-light);
            border-radius: 4px;
            font-size: 16px;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
        }
        /* 更新图标颜色 */
        .fas {
            color: var(--accent);
        }

        .modal-header .fas,
        .button .fas {
            color: white;
        }

        /* 添加新的样式 */
        .side-buttons {
            position: fixed;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 1000;
        }

        .side-button {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background-color: var(--accent);
            color: var(--accent-light);
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            box-shadow: 0 2px 10px var(--shadow);
            transition: all 0.3s ease;
        }

        .side-button:hover {
            background-color: var(--accent);
            color: var(--accent-light);
            transform: scale(1.1);
        }

        .side-button i {
            font-size: 24px;
            color: var(--accent-light);
        }
        @media (max-width: 768px) {
            .container {
                padding: 0 10px;
            }
            .course-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .course-header .button {
                margin-top: 10px;
            }
            .side-buttons {
                left: 10px;
            }

            .side-button {
                width: 50px;
                height: 50px;
            }

            .side-button i {
                font-size: 20px;
            }

            .main-content {
                margin-left: 60px;
            }
        }
    </style>
</head>
<body>
<header class="header">
    <div class="container">
        <div class="header-content">
            <h1 class="logo">S.A.Y.--Student Dashboard</h1>
            <div class="right-section">
                <div class="user-info" th:if="${user != null}">
                    <div class="user-avatar" th:text="${#strings.toUpperCase(#strings.substring(user.username, 0, 1))}"></div>
                    <div class="user-details">
                        <p><i class="fas fa-user"></i> <span th:text="${user.username}"></span></p>
                        <p><i class="fas fa-id-card"></i> <span th:text="${user.userId}"></span></p>
                        <p><i class="fas fa-graduation-cap"></i> <span th:text="${user.major}"></span></p>
                        <p><i class="fas fa-envelope"></i> <span th:text="${user.email}"></span></p>
                        <p><i class="fas fa-user-tag"></i> <span th:text="${user.userType}"></span></p>
                        <a href="/" class="button"><i class="fas fa-sign-out-alt"></i> Log out</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<!-- 添加侧边按钮 -->
<div class="side-buttons">
    <a href="/api/feedback/form" class="side-button">
        <i class="fas fa-comment"></i>
    </a>
    <a href="/search" class="side-button">
        <i class="fas fa-search"></i>
    </a>
</div>

<main class="main-content">
    <div class="container">
        <div class="course-header">
            <h2>My Courses</h2>
            <button id="createCourseBtn" class="button"><i class="fas fa-plus"></i> Add Course</button>
        </div>
        <div id="courseList">
            <!-- Course list will be dynamically loaded here -->
        </div>
    </div>
</main>

<div id="addCourseModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2><i class="fas fa-plus-circle"></i> Add Course</h2>
            <span class="close">&times;</span>
        </div>
        <form id="addCourseForm">
            <div class="form-group">
                <label for="courseId"><i class="fas fa-id-badge"></i> Course ID:</label>
                <input type="text" id="courseId" placeholder="Enter Course ID" required>
            </div>
            <div class="form-group">
                <label for="coursePin"><i class="fas fa-key"></i> Course PIN:</label>
                <input type="text" id="coursePin" placeholder="Enter Course PIN" required>
            </div>
            <button type="submit" class="button"><i class="fas fa-plus"></i> Add Course</button>
        </form>
    </div>
</div>

<script th:inline="javascript">
    // Get user ID
    const userId = /*[[${user.userId}]]*/ 'defaultUserId';

    // Load courses
    function loadCourses() {
        fetch(`/api/student/course/list?userId=${userId}`)
            .then(response => response.json())
            .then(courses => {
                const courseList = document.getElementById('courseList');
                courseList.innerHTML = ''; // Clear existing list
                courses.forEach(course => {
                    const courseElement = document.createElement('div');
                    courseElement.className = `course-card ${course.courseCategory.toLowerCase()}`;
                    courseElement.setAttribute('data-course-id', course.courseId);

                    // 修改这部分代码
                    if (course.isReal === false || course.isReal === 'false') {
                        const incompleteTag = document.createElement('div');
                        incompleteTag.className = 'incomplete-tag';
                        incompleteTag.textContent = 'Unfinished';
                        courseElement.appendChild(incompleteTag);
                    }

                    const courseId = document.createElement('div');
                    courseId.textContent = course.courseId;
                    courseElement.appendChild(courseId);

                    const courseName = document.createElement('div');
                    courseName.textContent = course.courseName;
                    courseElement.appendChild(courseName);

                    // Add click event listener
                    courseElement.addEventListener('click', function() {
                        navigateToCourseDetail(course.courseId);
                    });

                    courseList.appendChild(courseElement);
                });
            })
            .catch(error => console.error('Error loading courses:', error));
    }

    // Navigate to course detail page
    function navigateToCourseDetail(courseId) {
        window.location.href = `/course-detail?id=${courseId}`;
    }

    // Add course
    function addCourse(courseId, coursePin) {
        fetch('/api/student/course/add', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
            },
            body: `courseId=${courseId}&coursePin=${coursePin}&userId=${userId}`
        })
            .then(response => response.json())
            .then(data => {
                alert(data.message);
                if (data.redirectUrl) {
                    loadCourses(); // Reload course list
                    closeModal();
                }
            })
            .catch(error => console.error('Error adding course:', error));
    }

    // Open modal
    function openModal() {
        document.getElementById('addCourseModal').style.display = 'block';
    }

    // Close modal
    function closeModal() {
        document.getElementById('addCourseModal').style.display = 'none';
    }

    // Execute when page is loaded
    document.addEventListener('DOMContentLoaded', function() {
        loadCourses();

        const addCourseBtn = document.getElementById('createCourseBtn');
        const closeBtn = document.querySelector('.close');
        const addCourseForm = document.getElementById('addCourseForm');
        const modal = document.getElementById('addCourseModal');

        if (addCourseBtn) {
            addCourseBtn.addEventListener('click', openModal);
        }

        if (closeBtn) {
            closeBtn.addEventListener('click', closeModal);
        }

        if (addCourseForm) {
            addCourseForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const courseId = document.getElementById('courseId').value;
                const coursePin = document.getElementById('coursePin').value;
                addCourse(courseId, coursePin);
            });
        }

        // Close modal when clicking outside
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                closeModal();
            }
        });

        // Add debug logs
        console.log('DOM fully loaded');
        console.log('Add Course button:', addCourseBtn);
        console.log('Close button:', closeBtn);
        console.log('Add Course form:', addCourseForm);
        console.log('Modal:', modal);
    });
</script>
</body>
</html>
